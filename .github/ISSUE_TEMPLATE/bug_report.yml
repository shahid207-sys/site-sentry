name: Bug report
description: Something in SiteSentry does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems use a private advisory (see SECURITY.md), not this form. For a rule that reports something wrong, use "False positive report".
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the audit profile and settings. A run against the fixture site or a public example is best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Docker compose, npm (development), Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Worker or app output. Remove secrets, credentials and private URLs first.
      render: shell
