# Every pull request and push to the default branch: install, types, lint, unit tests, integration tests and a
# production build. The phase gates crawl the local fixture site and take minutes (Chromium, Lighthouse), so they run
# only when started by hand: Actions → ci → Run workflow → tick "gates".
name: ci

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      gates:
        description: Also run the phase gates (heavy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same loopback ports and credentials as docker-compose.yml, which the tests and gates default to.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitesentry
          POSTGRES_PASSWORD: sitesentry
          POSTGRES_DB: sitesentry
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sitesentry -d sitesentry" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://sitesentry:sitesentry@127.0.0.1:5433/sitesentry
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The render tests and gate:p5 drive a real headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run build

      # Gates: manual dispatch only. gate:p3, p4, p5 and p6 start the production app, so they need the build above.
      - name: Gates
        if: github.event_name == 'workflow_dispatch' && inputs.gates
        run: |
          set -e
          npm run gate:p1
          npm run gate:p2a
          npm run gate:p2b
          npm run gate:p3
          # gate:p4 runs Lighthouse (desktop preset); its performance target sits close to the scores measured
          # locally, so a slow runner can fail it: the log names the metric.
          npm run gate:p4
          npm run gate:p5
          # gate:p6 covers scheduled audits and the signed webhook alert only.
          npm run gate:p6
